# Satu pintu untuk perangkat LAN: http://<IP-laptop>:8080
# Semua lewat origin yang sama, jadi frontend tidak perlu IP tertanam dan cookie login berlaku.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# WebSocket hanya dari origin yang sama (atau tanpa Origin, mis. klien non-browser).
map "$http_origin|http://$http_host" $ws_origin_ok {
  default 0;
  "~^\|" 1;
  "~^(.+)\|\1$" 1;
}

# Cache hasil cek login 30 dt per token agar aset Grafana tidak membanjiri /api/auth/me (limiter 300/menit).
proxy_cache_path /tmp/gfauth keys_zone=gfauth:1m max_size=1m inactive=1m;

server {
  listen 80;
  client_max_body_size 6m;  # upload gambar AI maks 5 MB

  location /api/ {
    include /etc/nginx/conf.d/proxy.inc;
    proxy_pass http://backend:3001;
  }

  location /ws/ {
    if ($ws_origin_ok = 0) { return 403; }
    include /etc/nginx/conf.d/proxy.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Origin "";  # sudah divalidasi di atas; backend menolak Origin asing
    proxy_read_timeout 1h;
    proxy_pass http://backend:3001;
  }

  # Grafana tidak lagi anonim ke LAN: wajib sesi login dashboard.
  location = /_auth {
    internal;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_pass http://backend:3001/api/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_cache gfauth;
    proxy_cache_key $cookie_bmonitor_token;
    proxy_cache_valid 200 30s;
  }

  location /grafana/ {
    auth_request /_auth;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://grafana:3000;
  }

  location / {
    include /etc/nginx/conf.d/proxy.inc;
    proxy_pass http://frontend:3000;
  }
}
